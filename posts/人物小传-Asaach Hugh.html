<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asaach Hugh</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        body {
            background-image: url('/zhiwen.jpg');    /* 👈 你的浅色背景图 */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;             /* 👈 靠左 */
            align-items: flex-start;                 /* 👈 靠上，避免内容被挤压 */
            padding: 40px 30px;
            position: relative;
        }

        /* ===== 没有遮罩 ===== */

        .container {
            position: relative;
            z-index: 1;
            max-width: 720px;
            width: 100%;
            text-align: left;
            color: #2c1f2e;
            line-height: 1.9;
            padding: 10px 0;
        }

        .container h1 {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 900;
            font-size: 38px;
            letter-spacing: 4px;
            color: #2c1f2e;
            margin-bottom: 12px;
            text-align: left;
        }

        .container .divider {
            border: none;
            border-top: 1px solid rgba(80, 60, 50, 0.12);
            margin: 0 0 20px;
        }

        .container p {
            font-size: 17px;
            color: #2c1f2e;
            text-indent: 2em;              /* 👈 首行空两格 */
            margin-bottom: 12px;
            text-align: left;
        }

        .nav-links {
            margin-top: 30px;
            padding-top: 16px;
            border-top: 1px solid rgba(80, 60, 50, 0.08);
        }

        .nav-links a {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 400;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(60, 40, 35, 0.45);
            text-decoration: none;
            transition: color 0.3s ease;
            margin-right: 20px;
        }

        .nav-links a:hover {
            color: rgba(60, 40, 35, 0.8);
        }

        @media (max-width: 600px) {
            body { padding: 20px 16px; }
            .container h1 { font-size: 28px; }
            .container p { font-size: 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Asaach Hugh</h1>
        <hr class="divider">
        <p>没写完</p>
        <div class="nav-links">
            <a href="/series/主线-人物小传.html">← 返回关系网</a>
            <a href="/series/主线.html">主线</a>
            <a href="/">主页</a>
        </div>
    </div>

</body>
</html>
