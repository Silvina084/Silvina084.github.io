<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主线 · 人物小传</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        body {
            background-image: url('/ifbeijing.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 30px 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 960px;
            width: 100%;
            text-align: left;
            margin-left: 4%;
        }

        .container h1 {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 900;
            font-size: 42px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #d6e5f0;
            text-shadow: 0 0 40px rgba(150, 200, 230, 0.15), 0 4px 30px rgba(0,0,0,0.5);
            margin-bottom: 4px;
        }

        .container .sub-label {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 400;
            font-size: 16px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(180, 210, 230, 0.5);
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .nav-links {
            margin: 16px 0 24px;
        }

        .nav-links a {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 400;
            font-size: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(180, 210, 230, 0.5);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: rgba(180, 210, 230, 0.9);
        }

        .web-container {
            position: relative;
            width: 100%;
            max-width: 850px;
            margin: 10px 0 20px;
        }

        .web-svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .web-svg .line {
            stroke: rgba(180, 210, 230, 0.3);
            stroke-width: 2.5;
            stroke-dasharray: 8 6;
        }

        .web-svg .line-glow {
            stroke: rgba(150, 200, 230, 0.08);
            stroke-width: 12;
        }

        .node-group {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .node-group:hover {
            filter: drop-shadow(0 0 30px rgba(150, 200, 230, 0.25));
        }

        .node-group:hover .node-bg {
            fill: rgba(180, 210, 230, 0.15);
            stroke: rgba(180, 210, 230, 0.5);
        }

        .node-bg {
            fill: rgba(0, 0, 0, 0.4);
            stroke: rgba(180, 210, 230, 0.2);
            stroke-width: 2;
            transition: all 0.3s ease;
        }

        .node-name {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 700;
            font-size: 20px;
            fill: rgba(220, 240, 255, 0.9);
            text-anchor: middle;
            letter-spacing: 2px;
            dominant-baseline: central;
        }

        .node-race {
            font-family: 'Georgia', serif;
            font-size: 14px;
            fill: rgba(180, 210, 230, 0.5);
            text-anchor: middle;
            letter-spacing: 1px;
            dominant-baseline: central;
        }

        .relation-note {
            margin-top: 24px;
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 400;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(160, 195, 215, 0.3);
            border-top: 1px solid rgba(180, 210, 230, 0.06);
            padding-top: 18px;
        }

        .back-link {
            display: inline-block;
            margin-top: 18px;
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 400;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(160, 195, 215, 0.35);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: rgba(160, 195, 215, 0.7);
        }

        @media (max-width: 600px) {
            body { padding: 20px 16px; }
            .container { margin-left: 0; }
            .container h1 { font-size: 28px; letter-spacing: 4px; }
            .web-container { max-width: 100%; }
            .node-name { font-size: 16px; }
            .node-race { font-size: 12px; }
            body::before { background: rgba(0, 0, 0, 0.45); }
        }
    </style>
</head>

            </svg>
        </div>

        <a href="/" class="back-link">— MH.2026 —</a>

</html>
