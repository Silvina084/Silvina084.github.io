    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap');

        * {

            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        body {
            background-image: url('/aigangdiao.jpg');   /* 👈 你的深红+浅红交织背景图 */
            background-size: cover;

            align-items: flex-start;
            padding: 40px 20px;
            position: relative;
        }

        /* ===== 半透明遮罩（让文字更清晰） ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.20);      /* 👈 轻微加深 */

        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            width: 100%;
            text-align: center;
            padding-top: 10px;
        }

        .container h1 {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 900;
            font-size: 34px;
            letter-spacing: 4px;
            color: #f5e6d3;              /* 👈 暖白/淡粉色，和红底搭配 */
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
            margin-bottom: 4px;
        }

        .container .sub-label {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 400;
            font-size: 14px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(245, 230, 211, 0.5);   /* 👈 暖白半透明 */
            margin-bottom: 24px;
        }

        .nav-links {
            margin: 16px 0 24px;
        }

        .nav-links a {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 400;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(245, 230, 211, 0.4);
            text-decoration: none;
            transition: color 0.3s ease;
            margin: 0 6px;
        }

        .nav-links a:hover {
            color: rgba(245, 230, 211, 0.8);
        }

        .nav-links span {
            color: rgba(245, 230, 211, 0.1);
            margin: 0 4px;
        }

        .series-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-top: 10px;
        }

        .series-card {
            display: block;
            width: 100%;
            max-width: 300px;
            padding: 16px 28px;
            border-radius: 30px;
            border: 1px solid rgba(245, 230, 211, 0.12);
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(4px);
            text-decoration: none;
            text-align: center;
            transition: all 0.4s ease;
        }

        .series-card:hover {
            background: rgba(245, 230, 211, 0.06);
            border-color: rgba(245, 230, 211, 0.25);
            transform: translateY(-3px);
        }

        .series-card h3 {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 400;
            font-size: 17px;
            letter-spacing: 3px;
            color: rgba(245, 230, 211, 0.75);
            margin: 0;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 400;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(245, 230, 211, 0.15);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: rgba(245, 230, 211, 0.4);
        }

        @media (max-width: 600px) {
            body { padding: 20px 16px; }
            .container h1 { font-size: 26px; letter-spacing: 3px; }
            .series-card { max-width: 260px; padding: 14px 20px; }
            .series-card h3 { font-size: 15px; letter-spacing: 2px; }
            body::before { background: rgba(0, 0, 0, 0.25); }
