<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IF线</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        body {
            background-image: url('/IFxian.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            display: flex;
            justify-content: flex-end;      /* 👈 靠右 */
            align-items: center;
            padding: 30px 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            width: 100%;
            text-align: left;
            margin-right: 8%;              /* 👈 右侧四分之一处 */
        }

        .container h1 {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 900;
            font-size: 42px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #d6e5f0;
            text-shadow: 0 0 40px rgba(150, 200, 230, 0.15), 0 4px 30px rgba(0,0,0,0.5);
            margin-bottom: 4px;
        }

        .container .sub-label {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 400;
            font-size: 14px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(180, 210, 230, 0.5);
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .nav-links {
            margin: 16px 0 20px;
        }

        .nav-links a {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 400;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(180, 210, 230, 0.5);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: rgba(180, 210, 230, 0.9);
        }

        .series-grid {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 14px;
            margin-top: 10px;
        }

        .series-card {
            display: block;
            width: 100%;
            max-width: 260px;
            padding: 16px 28px;
            border-radius: 30px;
            border: 1px solid rgba(180, 210, 230, 0.15);
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(4px);
            text-decoration: none;
            text-align: center;
            transition: all 0.4s ease;
        }

        .series-card:hover {
            background: rgba(180, 210, 230, 0.08);
            border-color: rgba(180, 210, 230, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(100, 180, 220, 0.08);
        }

        .series-card h3 {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 400;
            font-size: 18px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(200, 220, 235, 0.8);
            margin: 0;
            text-align: center;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 400;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(160, 195, 215, 0.35);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: rgba(160, 195, 215, 0.7);
        }

        @media (max-width: 768px) {
            .container {
                margin-right: 4%;          /* 👈 手机上往右收一点 */
            }
        }

        @media (max-width: 600px) {
            body { padding: 20px 24px; }
            body { justify-content: center; }  /* 👈 手机上居中，不挤边 */
            .container { margin-right: 0; }
            .container h1 { font-size: 30px; letter-spacing: 4px; }
            .container .sub-label { font-size: 12px; letter-spacing: 4px; }
            .series-card { max-width: 220px; padding: 14px 20px; }
            .series-card h3 { font-size: 15px; letter-spacing: 3px; }
            body::before { background: rgba(0, 0, 0, 0.45); }
        }

        @media (max-width: 400px) {
            body { padding: 16px 18px; }
            .container h1 { font-size: 24px; letter-spacing: 3px; }
            .series-card { max-width: 180px; padding: 12px 16px; }
            .series-card h3 { font-size: 13px; letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>IF线</h1>
        <p class="sub-label">✦ 分类 ✦</p>

        <div class="nav-links">
            <a href="/">← 返回主页</a>
        </div>

        <div class="series-grid">
            <a href="/series/if线-杀手们和条子们.html" class="series-card">
                <h3>杀手们和条子们</h3>
            </a>
            <a href="/series/if线-脱口秀.html" class="series-card">
                <h3>脱口秀</h3>
            </a>
            <a href="/series/if线-会所.html" class="series-card">
                <h3>会所</h3>
            </a>
            <a href="/series/if线-收养.html" class="series-card">
                <h3>收养</h3>
            </a>
            <a href="/series/if线-史同.html" class="series-card">
                <h3>史同</h3>
            </a>
            <a href="/series/if线-杂七杂八的.html" class="series-card">
                <h3>杂七杂八的</h3>
            </a>
        </div>

        <a href="/" class="back-link">— MH.2026 —</a>
    </div>

</body>
</html>
