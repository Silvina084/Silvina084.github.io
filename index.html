<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MostlyHarmless'impart</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        body {
            background-image: url('/zhuyeditu.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: 0;
        }

        .hero {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        /* ===== 顶部导航：主页 + 角色百科 横排 ===== */
        .top-nav {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 20px;
        }

        .top-nav a {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 400;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(180, 210, 230, 0.5);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .top-nav a:hover {
            color: rgba(180, 210, 230, 0.9);
        }

        /* ===== 左上角标注（比大标题小，比副标题大） ===== */
        .hero .top-label {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 400;
            font-size: 18px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(180, 210, 230, 0.45);
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
            margin-bottom: 4px;
        }

        /* ===== 大标题 ===== */
        .hero h1 {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 900;
            font-size: 64px;
            letter-spacing: 10px;
            text-transform: uppercase;
            color: #d6e5f0;
            text-shadow: 0 0 40px rgba(150, 200, 230, 0.15), 0 4px 30px rgba(0,0,0,0.5);
            margin-bottom: 4px;
        }

        /* ===== 副标题（只比元信息大一点点） ===== */
        .hero .subtitle {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 400;
            font-size: 14px;          /* 👈 从 16px 缩小到 14px */
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(180, 210, 230, 0.6);
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
            margin-bottom: 4px;
        }

        /* ===== 分隔线 ===== */
        .hero .divider {
            width: 70px;
            height: 2px;
            background: rgba(180, 210, 230, 0.25);
            margin: 12px auto 14px;
        }

        /* ===== 元信息（比副标题再小一点） ===== */
        .hero .meta {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 400;
            font-size: 12px;          /* 👈 比副标题的 14px 小 */
            letter-spacing: 5px;
            color: rgba(160, 195, 215, 0.45);
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
            margin-bottom: 32px;
        }

        /* ===== 下方导航：世界观、主线、IF线 竖排 ===== */
        .main-nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .main-nav a {
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 400;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(200, 220, 235, 0.7);
            text-decoration: none;
            padding: 10px 32px;
            min-width: 160px;
            border: 1px solid rgba(180, 210, 230, 0.15);
            border-radius: 30px;
            transition: all 0.4s ease;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            text-align: center;
        }

        .main-nav a:hover {
            color: #e8f0f8;
            border-color: rgba(180, 210, 230, 0.5);
            background: rgba(180, 210, 230, 0.08);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(100, 180, 220, 0.08);
        }

        .hero .footer {
            margin-top: 40px;
            font-family: 'Cinzel', 'Georgia', serif;
            font-weight: 400;
            font-size: 11px;
            letter-spacing: 6px;
            color: rgba(160, 195, 215, 0.25);
        }

        @media (max-width: 600px) {
            .hero .top-label {
                font-size: 14px;
                letter-spacing: 4px;
            }
            .hero h1 {
                font-size: 38px;
                letter-spacing: 6px;
            }
            .hero .subtitle {
                font-size: 12px;
                letter-spacing: 4px;
            }
            .hero .meta {
                font-size: 10px;
                letter-spacing: 4px;
            }
            .top-nav a {
                font-size: 11px;
                letter-spacing: 3px;
            }
            .main-nav a {
                font-size: 12px;
                letter-spacing: 3px;
                padding: 8px 24px;
                min-width: 130px;
            }
            body::before {
                background: rgba(0, 0, 0, 0.45);
            }
        }

        @media (max-width: 400px) {
            .hero .top-label {
                font-size: 12px;
                letter-spacing: 3px;
            }
            .hero h1 {
                font-size: 28px;
                letter-spacing: 4px;
            }
            .hero .subtitle {
                font-size: 11px;
                letter-spacing: 3px;
            }
            .hero .meta {
                font-size: 9px;
                letter-spacing: 3px;
            }
            .top-nav a {
                font-size: 10px;
                letter-spacing: 2px;
            }
            .main-nav a {
                font-size: 11px;
                padding: 6px 18px;
                min-width: 100px;
            }
        }
    </style>
</head>
<body>

    <div class="hero">

        <!-- ===== 顶部：主页 + 角色百科 横排 ===== -->
        <div class="top-nav">
            <a href="/">主页</a>
            <a href="/wiki/角色百科.html">角色百科</a>
        </div>

        <!-- ===== 左上角标注 ===== -->
        <p class="top-label">Welcome to</p>

        <!-- ===== 大标题 ===== -->
        <h1>The World</h1>

        <!-- ===== 副标题（缩小版） ===== -->
        <p class="subtitle">It sucks.You're gonna love it.</p>

        <div class="divider"></div>

        <!-- ===== 元信息 ===== -->
        <p class="meta">by 基本无害。</p>

        <!-- ===== 下方导航 ===== -->
        <div class="main-nav">
            <a href="/series/世界观简介.html">世界观</a>
            <a href="/series/主线.html">主线</a>
            <a href="/series/if线.html">IF线</a>
        </div>

        <div class="footer">— MH.2026 —</div>
    </div>

</body>
</html>
